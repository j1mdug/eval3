[project]
name = "agent-code-evaluator"
version = "0.2.0"
description = "Implement a spec in an existing Python repo: one model writes the tests, another the code, a third reviews."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "openai>=1.40",
    "pytest>=8.0",
    "hypothesis>=6.0",
]

[project.scripts]
ace = "ace.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ace"]

[tool.setuptools.package-data]
ace = ["SKILL.md"]
